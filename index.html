<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>させぼ五番街店 日次報告作成</title>
  <style>
    :root {
      --primary-color: #2e7d32;
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }

    .header-title {
      text-align: center;
      margin: 0 0 20px 0;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--primary-color);
      color: var(--text-color);
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .date-row label {
      font-weight: bold;
    }

    input[type="date"] {
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .item-label {
      font-size: 0.95rem;
      font-weight: 500;
      flex: 1;
    }

    .counter-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-counter {
      width: 38px;
      height: 38px;
      border: none;
      background-color: var(--primary-color);
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: manipulation;
      transition: opacity 0.1s;
    }

    .btn-counter:active {
      opacity: 0.7;
    }

    .input-num {
      width: 50px;
      height: 38px;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      border: 1px solid #ccc;
      border-radius: 6px;
      -moz-appearance: textfield;
    }

    .input-num::-webkit-outer-spin-button,
    .input-num::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .preview-card {
      display: flex;
      flex-direction: column;
    }

    textarea {
      width: 100%;
      height: 480px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
      background-color: #fafafa;
      box-sizing: border-box;
    }

    .btn-copy {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-copy:hover {
      opacity: 0.9;
    }

    .copy-status {
      text-align: center;
      font-size: 0.9rem;
      color: var(--primary-color);
      font-weight: bold;
      height: 20px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<h1 class="header-title">させぼ五番街店 日次報告作成</h1>

<div class="main-layout">
  <!-- 左エリア: 入力フォーム -->
  <div class="input-grid">
    
    <!-- 基本実績 -->
    <div class="card">
      <h2 class="card-title">基本実績</h2>
      <div class="date-row">
        <label for="date">日付</label>
        <input type="date" id="date">
      </div>
      <div class="item-row">
        <span class="item-label">新規発番</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('shinki', -1)">-</button>
          <input type="number" id="shinki" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('shinki', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">MNP</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('mnp', -1)">-</button>
          <input type="number" id="mnp" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('mnp', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">機種変更</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('kishu', -1)">-</button>
          <input type="number" id="kishu" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('kishu', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">楽天ひかり</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('hikari', -1)">-</button>
          <input type="number" id="hikari" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('hikari', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">Turbo</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('turbo', -1)">-</button>
          <input type="number" id="turbo" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('turbo', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">カード</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('card', -1)">-</button>
          <input type="number" id="card" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('card', 1)">+</button>
        </div>
      </div>
    </div>

    <!-- オプション・物販 -->
    <div class="card">
      <h2 class="card-title">オプション・物販</h2>
      <div class="item-row">
        <span class="item-label">NWオプション</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('nw', -1)">-</button>
          <input type="number" id="nw" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('nw', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">iPhone販売数</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('iphone', -1)">-</button>
          <input type="number" id="iphone" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('iphone', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">ADGUARD</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('adguard', -1)">-</button>
          <input type="number" id="adguard" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('adguard', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">AOS Box</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('aos', -1)">-</button>
          <input type="number" id="aos" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('aos', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">ピカプロDX</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('pikapuro', -1)">-</button>
          <input type="number" id="pikapuro" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('pikapuro', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">コドマモ</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('kodomamo', -1)">-</button>
          <input type="number" id="kodomamo" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('kodomamo', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">SIMPLE TAP イージー</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('simpletap', -1)">-</button>
          <input type="number" id="simpletap" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('simpletap', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">OPPO充電器販売</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('oppo', -1)">-</button>
          <input type="number" id="oppo" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('oppo', 1)">+</button>
        </div>
      </div>
    </div>

    <!-- 来客数 -->
    <div class="card">
      <h2 class="card-title">来客数</h2>
      <div class="item-row">
        <span class="item-label">客数</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('kyaku', -1)">-</button>
          <input type="number" id="kyaku" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('kyaku', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">人数</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('ninzu', -1)">-</button>
          <input type="number" id="ninzu" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('ninzu', 1)">+</button>
        </div>
      </div>
    </div>

    <!-- 楽天ひかり申込内訳 -->
    <div class="card">
      <h2 class="card-title">＊楽天ひかり申込内訳</h2>
      <div class="item-row">
        <span class="item-label">新規</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('h_shinki', -1)">-</button>
          <input type="number" id="h_shinki" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('h_shinki', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">事変</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('h_jihen', -1)">-</button>
          <input type="number" id="h_jihen" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('h_jihen', 1)">+</button>
        </div>
      </div>
      <div class="item-row">
        <span class="item-label">転用</span>
        <div class="counter-control">
          <button class="btn-counter" onclick="changeVal('h_tenyo', -1)">-</button>
          <input type="number" id="h_tenyo" class="input-num" value="0" min="0">
          <button class="btn-counter" onclick="changeVal('h_tenyo', 1)">+</button>
        </div>
      </div>
    </div>

  </div>

  <!-- 右エリア: 出力テキスト -->
  <div class="card preview-card">
    <h2 class="card-title">出力プレビュー</h2>
    <textarea id="output" readonly></textarea>
    <button class="btn-copy" onclick="copyToClipboard()">テキストをコピー</button>
    <div class="copy-status" id="copyStatus"></div>
  </div>
</div>

<script>
  // 当日の日付を初期セット
  document.getElementById('date').valueAsDate = new Date();

  // カウント増減処理
  function changeVal(id, delta) {
    const input = document.getElementById(id);
    let current = parseInt(input.value, 10);
    if (isNaN(current)) current = 0;
    current += delta;
    if (current < 0) current = 0;
    input.value = current;
    generateText();
  }

  // 出力テキストの生成
  function generateText() {
    const dateVal = document.getElementById('date').value;
    let dateStr = "xx月xx日";
    if (dateVal) {
      const parts = dateVal.split('-');
      if (parts.length === 3) {
        dateStr = `${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日`;
      }
    }

    const val = (id) => {
      const v = document.getElementById(id).value;
      return v === "" ? "0" : v;
    };

    const text = `【${dateStr}　させぼ五番街店】
新規発番　 ${val('shinki')}件
MNP　 ${val('mnp')}件
機種変更　 ${val('kishu')}件
楽天ひかり　 ${val('hikari')}件
Turbo　 ${val('turbo')}件
カード　 ${val('card')}件

NWオプション　 ${val('nw')}台
iPhone販売数　 ${val('iphone')}台
ADGUARD　 ${val('adguard')}件
AOS Box　 ${val('aos')}件
ピカプロDX　 ${val('pikapuro')}件
コドマモ　 ${val('kodomamo')}件
SIMPLE TAP イージー　 ${val('simpletap')}件
OPPO充電器販売　 ${val('oppo')}件

客数　 ${val('kyaku')}組
人数　 ${val('ninzu')}人

＊楽天ひかり申込内訳
新規　　 ${val('h_shinki')}件
事変　　 ${val('h_jihen')}件
転用　　 ${val('h_tenyo')}件`;

    document.getElementById('output').value = text;
  }

  // 直接入力時にもリアルタイム反映
  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', generateText);
  });

  // クリップボードへコピー
  function copyToClipboard() {
    const output = document.getElementById('output');
    output.select();
    output.setSelectionRange(0, 99999);
    
    navigator.clipboard.writeText(output.value).then(() => {
      const status = document.getElementById('copyStatus');
      status.textContent = "クリップボードにコピーしました！";
      setTimeout(() => { status.textContent = ""; }, 2500);
    }).catch(() => {
      document.execCommand('copy');
      const status = document.getElementById('copyStatus');
      status.textContent = "コピーしました！";
      setTimeout(() => { status.textContent = ""; }, 2500);
    });
  }

  // 初期更新
  generateText();
</script>

</body>
</html>
